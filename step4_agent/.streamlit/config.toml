# Streamlit config for this app.
# "none" avoids reloading TensorFlow when files change (TF crashes on double-import).
[server]
fileWatcherType = "none"

# Light theme = readable labels/inputs by default (dark custom CSS broke contrast).
[theme]
base = "light"
primaryColor = "#0d7377"
backgroundColor = "#f3f6f7"
secondaryBackgroundColor = "#e4ecee"
textColor = "#14232b"
font = "sans serif"
